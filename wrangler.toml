name = "moadalaty-site"
main = "src/index.js"
compatibility_date = "2026-08-15"

[assets]
directory = "./"
binding = "ASSETS"
# كان بس ["/api/*"] — يعني الـ Worker كان بيشتغل بس على مسارات الـ API،
# وأي صفحة HTML تانية كانت بتتقدّم مباشرة من الملفات الساكنة من غير ما
# تمر على الـ Worker خالص. غيّرناها لـ true عشان كل صفحة HTML تعدّي على
# الـ Worker أولاً، فيقدر يحقن فوتر موحّد فيها كلها (راجع rewriteFooterNav
# في src/index.js) — ده اللي بيحل مشكلة "تعديل الفوتر في 35+ ملف يدويًا".
run_worker_first = true

[[send_email]]
name = "SEND_EMAIL"
destination_address = "alamry17@gmail.com"

# عداد المشاهدات الحقيقي — راجع handleViews في src/index.js.
# الـ namespace ده اتعمل من Cloudflare Dashboard (Storage & databases → Workers KV)
# باسم VIEWS_KV، والـ id تحت هو الـ Namespace ID الحقيقي بتاعه.
[[kv_namespaces]]
binding = "VIEWS_KV"
id = "1c50f9910eba4707ad76b8dbaa0f9f1e"
